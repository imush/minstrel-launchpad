# Run the launchpad next to your media server.
#
#   docker compose up -d
#   docker compose logs launchpad     # prints the console's setup link
#
# On a NAS, paste this wherever it takes a compose file -- Synology's
# Container Manager -> Project, QNAP's Container Station, and so on -- and
# point the volume at a real share: /volume1/docker/launchpad on Synology,
# /share/Container/launchpad on QNAP, /mnt/user/appdata/launchpad on unRAID.
services:
  launchpad:
    image: imush/minstrel-launchpad:latest
    container_name: launchpad
    # Host networking is required: the launchpad finds media servers with SSDP
    # multicast, which does not cross a Docker bridge network. It also means
    # ports 7443 and 7444 are used directly, with nothing to map.
    network_mode: host
    volumes:
      # Keys, paired devices and settings. Must be a path you choose: an
      # unnamed volume is replaced when the container is recreated, which
      # silently unpairs every device.
      - ./data:/data
    restart: unless-stopped
