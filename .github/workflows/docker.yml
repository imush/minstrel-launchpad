# Builds and publishes the container image on every version tag.
#
# GitHub Container Registry needs no secrets. Docker Hub does, and it is the
# one that matters for NAS boxes: Synology's Container Manager and unRAID's
# Community Applications both search Docker Hub, so an image only on ghcr.io
# is an image those users cannot find. Set DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN in the repository secrets; without them the Docker Hub
# steps are skipped and the ghcr.io image is still published.
name: docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The secrets context is not dependable inside a step's "if", so it is
    # resolved once here and the steps test this instead.
    env:
      HAVE_HUB: ${{ secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4

      # The Go build cross-compiles and needs no emulation, but "apk add" in
      # the final stage runs as the target architecture, so arm64 needs QEMU.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.HAVE_HUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/minstrel-launchpad,enable=${{ secrets.DOCKERHUB_USERNAME != '' }}
          # v1.2.3 publishes 1.2.3, 1.2 and 1; "latest" only for a real release.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            # A manual run is not a release: it publishes "edge" and nothing else.
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
